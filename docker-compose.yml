services:

  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./storage/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ssh-honeypot:
    build:
      context: .
      dockerfile: sensors/ssh/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 2222
    ports:
      - "${SSH_BIND:-127.0.0.1}:${SSH_PORT:-2222}:2222"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: storage/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on: 
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  pgdata: